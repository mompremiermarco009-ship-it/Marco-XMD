<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MARCO-XMD | Accueil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00d4ff;
            --neon-dim: #0077b6;
            --bg: #0d0d0d;
            --text: #e0e0e0;
            --text-dim: #9a9a9a;
            --border: rgba(0, 212, 255, 0.2);
            --card-bg: rgba(20, 20, 30, 0.9);
            --metal-dark: #1c1c1c;
            --danger: #ff4757;
            --success: #2ed573;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0,212,255,0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0,212,255,0.05) 0%, transparent 40%),
                linear-gradient(45deg, transparent 24%, rgba(0,212,255,0.02) 25%, rgba(0,212,255,0.02) 26%, transparent 27%, transparent 74%, rgba(0,212,255,0.02) 75%, rgba(0,212,255,0.02) 76%, transparent 77%),
                linear-gradient(-45deg, transparent 24%, rgba(0,212,255,0.02) 25%, rgba(0,212,255,0.02) 26%, transparent 27%, transparent 74%, rgba(0,212,255,0.02) 75%, rgba(0,212,255,0.02) 76%, transparent 77%);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
        }
        .main-container { max-width: 900px; margin: 0 auto; padding: 20px 20px 30px; }

        .ad-banner {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px auto;
            border: 1px solid var(--neon);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--metal-dark);
            position: relative;
            clip-path: polygon(0 0, 100% 0, calc(100% - 15px) 100%, 0% 100%);
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .ad-banner:hover {
            border-color: var(--neon-dim);
            box-shadow: 0 0 30px var(--neon-dim), 0 10px 25px rgba(0,0,0,0.7);
            transform: scale(1.02);
        }
        .ad-banner video, .ad-banner img {
            width: 100%;
            max-height: 140px;
            object-fit: cover;
            display: block;
        }
        .ad-banner .ad-label {
            position: absolute;
            top: 8px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            color: var(--neon);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            padding: 2px 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header img.logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid var(--neon);
            box-shadow: 0 0 20px var(--neon-dim);
            margin-bottom: 15px;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            color: var(--neon);
            text-shadow: 0 0 20px var(--neon);
        }
        .header p { font-family: 'Share Tech Mono', monospace; color: #aaa; }
        .section-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon);
            margin: 30px 0 15px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--neon-dim);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            max-width: 700px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: var(--neon);
            box-shadow: 0 0 20px var(--neon-dim);
        }
        .card i { font-size: 2rem; color: var(--neon); }
        .card span { font-family: 'Share Tech Mono', monospace; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .hidden { display: none !important; }
        .btn {
            background: linear-gradient(135deg, #003d66, #0077b6);
            border: 1px solid var(--neon);
            color: #fff;
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: 0.3s;
        }
        .btn:hover { box-shadow: 0 0 15px var(--neon); }
        .back-btn {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 8px 20px;
            cursor: pointer;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--neon); color: #000; }
        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            padding: 12px;
            color: #fff;
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
            outline: none;
            font-family: 'Rajdhani', sans-serif;
        }
        #codeDisplay {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--neon);
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--metal-dark);
            border: 2px solid var(--neon);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            padding: 25px;
            width: 95%;
            max-width: 450px;
            position: relative;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,212,255,0.3);
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 2rem;
            color: var(--neon);
            cursor: pointer;
            background: none;
            border: none;
        }
        .footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            text-align: center; padding: 10px;
            background: rgba(0,0,0,0.9);
            border-top: 1px solid var(--neon);
            color: #666;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="main-container">
    <a href="https://influrence.onrender.com" target="_blank" class="ad-banner">
        <video autoplay muted loop playsinline>
            <source src="media/pub.mp4" type="video/mp4">
            <img src="media/pub.jpg" alt="Influrence" style="width:100%;max-height:140px;object-fit:cover;">
        </video>
        <span class="ad-label">SPONSORISÉ</span>
    </a>

    <div class="header">
        <img src="media/logo.jpg" alt="MARCO-XMD Logo" class="logo" onerror="this.style.display='none'">
        <h1>MARCO-XMD</h1>
        <p>/ accueil / interface publique</p>
    </div>

    <h2 class="section-title">/ actions /</h2>
    <div class="card-grid" id="mainMenu">
        <div class="card" id="btnPairing"><i class="fas fa-key"></i><span>Pairing</span></div>
        <div class="card" onclick="window.open('https://wa.me/50941131299?text=Salut%20Marco!', '_blank')"><i class="fas fa-user-astronaut"></i><span>Contact</span></div>
        <div class="card" onclick="window.open('https://whatsapp.com/channel/0029VbASWFzHFxP6cbTkkz08', '_blank')"><i class="fas fa-satellite-dish"></i><span>Chaîne</span></div>
        <div class="card" onclick="window.location.href='/games.html'"><i class="fas fa-gamepad"></i><span>Jeux</span></div>
        <div class="card" onclick="openAdmin()"><i class="fas fa-user-shield"></i><span>Admin</span></div>
    </div>

    <div id="pairingView" class="hidden">
        <button class="back-btn" id="btnBack"><i class="fas fa-arrow-left"></i> Retour</button>
        <div id="pairingChoice">
            <p style="margin-bottom:20px;">Choisissez votre méthode de connexion :</p>
            <div style="display:flex; gap:20px; justify-content:center; flex-wrap:wrap;">
                <button class="btn" onclick="startPairing('pair')"><i class="fas fa-key"></i> Code</button>
                <button class="btn" onclick="startPairing('qr')"><i class="fas fa-qrcode"></i> QR</button>
            </div>
        </div>
        <div id="pairingForm" class="hidden">
            <div class="input-group"><input type="text" id="phone" placeholder="509xxxxxxxx"></div>
            <button class="btn" id="actionBtn" style="width:100%;">Générer</button>
        </div>
        <div id="resultArea" class="hidden">
            <div id="codeDisplay"></div>
            <p style="margin:10px 0;">WhatsApp > Appareils connectés</p>
            <button class="btn" id="copyBtn">Copier</button>
            <button class="back-btn" style="width:100%; margin-top:10px;" id="retryBtn">Recommencer</button>
        </div>
    </div>

    <!-- Modale QR -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeQRModal()">&times;</span>
            <h3 style="color:var(--neon); font-family:'Orbitron',sans-serif;">Scanner le QR Code</h3>
            <div id="qrContainer" style="display:flex; justify-content:center; align-items:center; min-height:200px; margin:15px 0;">
                <p>Chargement...</p>
            </div>
            <p style="color:var(--text-dim);">WhatsApp > Appareils connectés > Scanner</p>
        </div>
    </div>
</div>

<div class="footer">© 2026 MARCO-XMD Bot — Tous droits réservés</div>

<script>
let currentMode = 'pair';
document.getElementById('btnPairing').addEventListener('click', ()=>{
    document.getElementById('mainMenu').style.display='none';
    document.getElementById('pairingView').classList.remove('hidden');
    document.getElementById('pairingChoice').classList.remove('hidden');
    document.getElementById('pairingForm').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
});
document.getElementById('btnBack').addEventListener('click', ()=>{
    document.getElementById('pairingView').classList.add('hidden');
    document.getElementById('mainMenu').style.display='';
});
function startPairing(mode) {
    currentMode = mode;
    document.getElementById('pairingChoice').classList.add('hidden');
    document.getElementById('pairingForm').classList.remove('hidden');
    document.getElementById('actionBtn').textContent = mode==='pair'?'Générer le code':'Afficher le QR Code';
    document.getElementById('actionBtn').onclick = mode==='pair'? generatePairingCode : showQRCode;
}
async function generatePairingCode() {
    let num = document.getElementById('phone').value.replace(/[^0-9]/g,'');
    if (num.length<10) return alert('Numéro invalide');
    document.getElementById('actionBtn').disabled = true;
    try {
        const res = await fetch(`/pair?number=${num}`);
        const data = await res.json();
        if (res.ok) {
            document.getElementById('codeDisplay').textContent = data.code;
            document.getElementById('pairingForm').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
        } else alert(data.error);
    } catch(e) { alert('Erreur réseau'); }
    finally { document.getElementById('actionBtn').disabled = false; }
}
async function showQRCode() {
    let num = document.getElementById('phone').value.replace(/[^0-9]/g,'');
    if (num.length<10) return alert('Numéro invalide');
    const qrModal = document.getElementById('qrModal');
    const qrContainer = document.getElementById('qrContainer');
    qrContainer.innerHTML = '<p>Chargement...</p>';
    qrModal.classList.add('active');
    try {
        const res = await fetch(`/qr?number=${num}`);
        const data = await res.json();
        if (data.qr) {
            qrContainer.innerHTML = `<img src="${data.qr}" alt="QR Code" style="max-width:250px; border:4px solid #25D366; border-radius:10px;">`;
        } else {
            qrContainer.innerHTML = `<p style="color:red;">${data.error || 'Erreur'}</p>`;
        }
    } catch(e) {
        qrContainer.innerHTML = '<p style="color:red;">Erreur réseau.</p>';
    }
}
function closeQRModal() {
    document.getElementById('qrModal').classList.remove('active');
    document.getElementById('qrContainer').innerHTML = '<p>Chargement...</p>';
}
document.getElementById('retryBtn').addEventListener('click', ()=>{
    document.getElementById('resultArea').classList.add('hidden');
    document.getElementById('pairingForm').classList.remove('hidden');
});
document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(document.getElementById('codeDisplay').textContent);
    alert('Copié !');
});
function openAdmin(){ const pwd=prompt("Code d'accès :"); if(pwd==="marco2026") window.location.href="/admin.html"; else alert("Code incorrect."); }
</script>
</body>
</html>
